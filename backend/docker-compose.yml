services:
  app:
    image: ghcr.io/${GITHUB_USER_NAME}/qr-scanner:latest
    command: sh -c "node ace migration:run --force && node build/bin/server.js"
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - APP_KEY=${APP_KEY}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - SESSION_DRIVER=cookie
      - LOG_LEVEL=info
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
